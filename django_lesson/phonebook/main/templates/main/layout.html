{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <script src="https://kit.fontawesome.com/213b1bd621.js" crossorigin="anonymous"></script>
</head>
<body>
    <aside>
        <h3>Навигация</h3>
        <ul>
            <a href="{% url 'main_table' %}"><li><i class="fa-solid fa-house"></i> Телефонный справочник </li></a>
            <a href="{% url 'add_main' %}"><li><button class="btn btn-info"><i class="fas fa-plus-circle"></i> Добавить запись </button></li></a>
            <a href="{% url 'name' %}"><li><i class="fa-solid fa-signature"></i> Имена </li></a>
            <a href="{% url 'fam' %}"><li><i class="fa-solid fa-signature"></i> Фамилии</li></a>
            <a href="{% url 'otch' %}"><li><i class="fa-solid fa-signature"></i> Отчества </li></a>
            <a href="{% url 'street' %}"><li><i class="fa-solid fa-street-view"></i> Улицы </li></a>
        </ul>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
