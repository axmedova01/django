{% extends 'main/layout.html' %}

{% block title %}Имена{% endblock %}

{% block content %}
    <div class="features">
        <h1>Таблица имен</h1>

        {% if message %}
             <script>alert("{{ message }}")</script>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            {{ form.name }} <br>
            <input type="submit" class="btn btn-light" value="Добавить">
            <input type="submit" class="btn btn-light" value="Обновить">
        </form>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for el in name_data %}
                    <tr>
                        <td>{{ el.id_name }}</td>
                        <td>{{ el.name }}</td>
                        <td>
                            <a href="{% url 'delete_name' el.id_name %}" class="btn btn-danger">Удалить</a>
                            <a href="{% url 'update_name' el.id_name %}" class="btn btn-success">Обновить</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

{% endblock %}
